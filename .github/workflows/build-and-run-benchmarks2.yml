  #   if: ${{ needs.check-previous-run.outputs.already-passed != 'true' }}
  #   permissions:
  #     packages: write
  #   uses: ./.github/workflows/docker-image.yml
  #   with:
  #     docker-version: ubuntu-24.04

  # build-tests:
  #   needs: ensure-image
  #   secrets: inherit
  #   uses: ./.github/workflows/build-tests.yml
  #   with:
  #     ubuntu-docker-version: ubuntu-24.04
  #     image-tag: ${{ needs.ensure-image.outputs.image-tag }}
  #     build-type: ${{ inputs.build-type || 'Release' }}
  #     build-wheel: false

  # Runs on the host (no container) so cpupower can reach cpufreq. A low fixed frequency on the
  # isolated CPUs keeps benchmark results stable.
  pin-cpu-frequency:
    needs: build-tests
    runs-on: [umd-lab, n300]
    steps:
      - name: Pin isolated CPUs to 1 GHz
        run: |
          isolated_cpus=$(cat /sys/devices/system/cpu/isolated)
          if [[ -z "$isolated_cpus" ]]; then
            echo "::error::No isolated CPUs on this runner, benchmark results would be unstable"
            exit 1
          fi
          sudo cpupower --cpus "$isolated_cpus" frequency-set -f 1GHz
