# Build UMD and run an arbitrary test command on dedicated exabox runners
# (sc1 / sc4 / sc16). Trigger from the Actions tab: pick hardware, paste a
# test command, and run.
#
# Uses exabox-multihost-ci-* labels (same model as tt-metal PR 52803). The
# runner hook provisions worker pods from container.image; there is no TTOP
# allocation/environment lifecycle in this workflow (that was the closed
# tt-umd PR 3090 approach).
#
# Reset uses ttop-ipmi-reset from the multihost-ci runner ConfigMap (same
# as metal's ttop-recovery). Validation uses UMD topology + system_health
# rather than metal's run_cluster_validation or tt-smi.
#
# Closes https://github.com/tenstorrent/tt-umd/issues/3089
# Supersedes https://github.com/tenstorrent/tt-umd/pull/3090
name: Run tests on exabox

on:
  workflow_dispatch:
    inputs:
      hardware:
        description: >-
          Exabox hardware (sc1 = 1 Galaxy, sc4 = 4-Galaxy quad,
          sc16 = 16-Galaxy SC16). Maps to runner label
          exabox-multihost-ci-<hardware>.
        required: true
        type: choice
        default: sc1
        options:
          - sc1
          - sc4
          - sc16
      test-command:
        description: >-
          Shell command run on every allocated host via mpirun --pernode
          (cwd /home/user/tt-umd, LD_LIBRARY_PATH includes build/lib). Example:
          ./build/test/umd/galaxy/unit_tests_glx
        required: true
        type: string
      build-type:
        description: CMake build type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
          - ASan
          - TSan
      ubuntu-docker-version:
        description: Ubuntu docker image version to build and use as worker image
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
      timeout:
        description: Per-job timeout in minutes (build and run)
        required: true
        default: 120
        type: number
      build-wheel:
        description: Also build and install the Python wheel on workers
        required: false
        default: false
        type: boolean

# id-token: write — multihost-ci runner chart may need OIDC.
permissions:
  id-token: write
  contents: read
  packages: write

env:
  ARTIFACT_NAME: >-
    build-artifacts-${{ inputs.ubuntu-docker-version }}-${{ inputs.build-type }}
  WHEEL_ARTIFACT_NAME: >-
    wheel-artifact-${{ inputs.ubuntu-docker-version }}-${{ inputs.build-type }}

jobs:
  ensure-docker-image:
    secrets: inherit
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      docker-version: ${{ inputs.ubuntu-docker-version }}

  build:
    needs: ensure-docker-image
    secrets: inherit
    uses: ./.github/workflows/build-tests.yml
    with:
      ubuntu-docker-version: ${{ inputs.ubuntu-docker-version }}
      build-type: ${{ inputs.build-type }}
      timeout: ${{ fromJSON(inputs.timeout) }}
      build-wheel: ${{ inputs.build-wheel }}
      image-tag: ${{ needs.ensure-docker-image.outputs.image-tag }}

  run:
    name: Run on exabox (${{ inputs.hardware }})
    needs: [ensure-docker-image, build]
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    runs-on:
      - exabox-multihost-ci-${{ inputs.hardware }}
    # Consumed by the multihost runner container hook to provision remote
    # worker pods. Job steps still run on the CPU/control runner; the hook
    # handles worker image setup.
    container:
      image: >-
        ghcr.io/${{ github.repository }}/tt-umd-ci-${{ inputs.ubuntu-docker-version
        }}:${{ needs.ensure-docker-image.outputs.image-tag }}
    env:
      PATH: /home/user/.local/bin:/opt/openmpi-v5.0.7-ulfm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME: /home/user
      LD_LIBRARY_PATH: /home/user/tt-umd/build/lib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Print hostnames
        working-directory: /tmp
        run: |
          mpirun --pernode --tag-output hostname

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /ci/artifacts

      - name: Download wheel artifact
        if: ${{ inputs.build-wheel }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: /ci/artifacts

      - name: Unpack artifacts onto workers
        run: |
          set -euo pipefail

          rm -rf /ci/tt-umd
          cp -r "$GITHUB_WORKSPACE" /ci/tt-umd

          BUILD_ARCHIVE=/ci/artifacts/artifact.tar
          if [ ! -f "$BUILD_ARCHIVE" ]; then
            echo "ERROR: expected $BUILD_ARCHIVE"
            ls -R /ci/artifacts
            exit 1
          fi

          # Local copy on the runner (handy for commands that launch from here).
          sudo rm -rf /home/user/tt-umd
          sudo mkdir -p /home/user
          sudo chown "$(id -u):$(id -g)" /home/user
          cp -r /ci/tt-umd /home/user/
          tar xf "$BUILD_ARCHIVE" -C /home/user/tt-umd

          # Fan out source + build to every allocated host via NFS + mpirun.
          mpirun --pernode bash -lc 'rm -rf /home/user/tt-umd && cp -r /ci/tt-umd /home/user/'
          mpirun --pernode tar xf "$BUILD_ARCHIVE" -C /home/user/tt-umd

          if [ "${{ inputs.build-wheel }}" = "true" ]; then
            shopt -s nullglob globstar
            wheels=(/ci/artifacts/tt_umd-*.whl /ci/artifacts/**/tt_umd-*.whl)
            if [ ${#wheels[@]} -eq 0 ]; then
              echo "ERROR: build-wheel requested but no tt_umd-*.whl under /ci/artifacts"
              ls -R /ci/artifacts
              exit 1
            fi
            echo "Installing wheel: ${wheels[0]}"
            mpirun --pernode bash -lc "python3 -m pip install --force-reinstall '${wheels[0]}'"
          fi

      - name: Install tt-smi on workers
        run: |
          set -euo pipefail
          # Install system-wide so root and non-login shells can find tt-smi
          # (a user install only lands in /home/user/.local/bin).
          mpirun --pernode --tag-output bash -lc \
            'sudo python3 -m pip install --no-cache-dir "tt-smi==5.2.0"
             command -v tt-smi
             tt-smi --version'

      - name: Reset cards and validate cluster
        working-directory: /tmp
        timeout-minutes: 90
        run: |
          set -euo pipefail
          MAX_RECOVERY_ATTEMPTS=10
          TOPOLOGY=/home/user/tt-umd/build/tools/umd/topology
          SYSTEM_HEALTH=/home/user/tt-umd/build/tools/umd/system_health
          export LD_LIBRARY_PATH=/home/user/tt-umd/build/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}

          if ! mpirun --pernode --tag-output bash -c \
            'command -v ttop-ipmi-reset >/dev/null 2>&1'; then
            echo "ERROR: ttop-ipmi-reset not on PATH on one or more workers"
            echo "Expected from the multihost-ci runner ConfigMap sidecar."
            exit 1
          fi

          echo "--- Checking socat availability (needed by ttop-ipmi-reset) ---"
          if ! mpirun --pernode bash -c 'command -v socat >/dev/null 2>&1'; then
            echo "Socat missing on some nodes, installing..."
            mpirun --pernode bash -c \
              'sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq socat >/dev/null'
          fi

          echo "--- Pre-check: topology visibility on all hosts ---"
          mpirun --pernode --tag-output -x LD_LIBRARY_PATH \
            bash -lc "cd /home/user/tt-umd && '${TOPOLOGY}'" || true

          run_system_health() {
            mpirun --pernode --tag-output -x LD_LIBRARY_PATH \
              bash -lc "cd /home/user/tt-umd && '${SYSTEM_HEALTH}'"
          }

          for attempt in $(seq 1 "$MAX_RECOVERY_ATTEMPTS"); do
            echo "=== Recovery attempt $attempt of $MAX_RECOVERY_ATTEMPTS ==="
            reset_success=false
            validation_success=false

            echo "--- Resetting cards with ttop-ipmi-reset ---"
            # Invoke via bash so a broken shebang (e.g. CRLF from ConfigMap) does
            # not surface as a silent exit 127 ("bad interpreter").
            set +e
            mpirun --pernode --tag-output bash /usr/local/bin/ttop-ipmi-reset
            reset_rc=$?
            set -e
            if [ "$reset_rc" -eq 0 ]; then
              reset_success=true
            else
              echo "WARNING: ttop-ipmi-reset failed on attempt $attempt (mpirun exit=$reset_rc)"
              echo "--- Per-host diagnostics after ttop-ipmi-reset failure ---"
              mpirun --pernode --tag-output bash -c '
                set +e
                echo "hostname=$(hostname)"
                echo "ttop-ipmi-reset=$(command -v ttop-ipmi-reset || echo MISSING)"
                echo "socat=$(command -v socat || echo MISSING)"
                ls -l /usr/local/bin/ttop-ipmi-reset 2>&1
                echo "--- shebang (cat -A) ---"
                head -1 /usr/local/bin/ttop-ipmi-reset | cat -A
                if [ -S /run/ttop-ipmi/reset ]; then
                  ls -l /run/ttop-ipmi/reset
                else
                  echo "socket=/run/ttop-ipmi/reset MISSING"
                  ls -la /run/ttop-ipmi 2>&1 || echo "/run/ttop-ipmi directory missing"
                fi
                echo "--- raw socket response (cat -A) ---"
                tmp=$(mktemp)
                socat -u UNIX-CONNECT:/run/ttop-ipmi/reset - >"$tmp" 2>"$tmp.err"
                echo "socat_rc=$?"
                cat -A "$tmp" 2>&1 || true
                echo "--- socat stderr ---"
                cat -A "$tmp.err" 2>&1 || true
                rm -f "$tmp" "$tmp.err"
                echo "--- exec direct ---"
                /usr/local/bin/ttop-ipmi-reset 2>&1
                echo "direct_rc=$?"
                echo "--- exec via bash ---"
                bash /usr/local/bin/ttop-ipmi-reset 2>&1
                echo "bash_rc=$?"
                exit 0
              ' || true
            fi

            if [ "$reset_success" = true ]; then
              echo "--- Sleeping 5s after reset to allow links/services to settle ---"
              sleep 5

              echo "--- Running UMD system_health ---"
              set +e
              run_system_health
              health_rc=$?
              set -e
              if [ "$health_rc" -eq 0 ]; then
                validation_success=true
              else
                echo "WARNING: system_health failed on attempt $attempt (mpirun exit=$health_rc)"
              fi
            else
              echo "WARNING: Skipping system_health because reset failed on attempt $attempt"
            fi

            if [ "$reset_success" = true ] && [ "$validation_success" = true ]; then
              echo "SUCCESS: Reset and system_health passed on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_RECOVERY_ATTEMPTS" ]; then
              echo "Sleeping 5m before retry (live debug window)..."
              sleep 300
            fi
          done

          echo "ERROR: Recovery failed after $MAX_RECOVERY_ATTEMPTS attempts"
          exit 1

      - name: Run test command
        id: run-test
        # TEST_COMMAND is expanded by this job's shell into the remote bash -lc
        # string (trusted workflow_dispatch). No eval — the remote shell runs the
        # command text directly. mpirun --pernode wraps it for every host.
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          echo "Running on every host via mpirun --pernode:"
          echo "$TEST_COMMAND"
          mpirun --pernode --tag-output -x LD_LIBRARY_PATH \
            bash -lc "cd /home/user/tt-umd && $TEST_COMMAND"
