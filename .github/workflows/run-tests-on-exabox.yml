# Build UMD and run an arbitrary test command on dedicated exabox runners
# (sc1 / sc4 / sc16). Trigger from the Actions tab: pick hardware, paste a
# test command, and run. The run itself lives in run-exabox-tests.yml.
name: Run tests on exabox

on:
  workflow_dispatch:
    inputs:
      hardware:
        description: >-
          Exabox hardware (sc1 = 1 Galaxy, sc4 = 4-Galaxy quad,
          sc16 = 16-Galaxy SC16). Maps to runner label
          exabox-multihost-ci-<hardware>.
        required: true
        type: choice
        default: sc1
        options:
          - sc1
          - sc4
          - sc16
      test-command:
        description: >-
          Shell command run on every allocated host via mpirun --pernode
          (cwd /home/user/tt-umd, LD_LIBRARY_PATH includes build/lib). Example:
          ./build/test/umd/galaxy/unit_tests_glx
        required: true
        type: string
      build-type:
        description: CMake build type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
          - ASan
          - TSan
      ubuntu-docker-version:
        description: >-
          Ubuntu version to build on. The exabox workers run the matching
          -exabox image, which adds the multihost tooling on top of it.
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
      timeout:
        description: Per-job timeout in minutes (build and run)
        required: true
        default: 120
        type: number
      build-wheel:
        description: Also build and install the Python wheel on workers
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  ensure-build-image:
    secrets: inherit
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      docker-version: ${{ inputs.ubuntu-docker-version }}

  # The exabox image shares the same base and toolchain as the build image, so
  # binaries built above run unchanged on the workers.
  ensure-exabox-image:
    secrets: inherit
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      docker-version: ${{ inputs.ubuntu-docker-version }}-exabox

  build:
    needs: ensure-build-image
    secrets: inherit
    uses: ./.github/workflows/build-tests.yml
    with:
      ubuntu-docker-version: ${{ inputs.ubuntu-docker-version }}
      build-type: ${{ inputs.build-type }}
      timeout: ${{ fromJSON(inputs.timeout) }}
      build-wheel: ${{ inputs.build-wheel }}
      image-tag: ${{ needs.ensure-build-image.outputs.image-tag }}

  run:
    needs: [ensure-exabox-image, build]
    secrets: inherit
    uses: ./.github/workflows/run-exabox-tests.yml
    with:
      hardware: ${{ inputs.hardware }}
      test-command: ${{ inputs.test-command }}
      build-type: ${{ inputs.build-type }}
      ubuntu-docker-version: ${{ inputs.ubuntu-docker-version }}
      timeout: ${{ fromJSON(inputs.timeout) }}
      install-wheel: ${{ inputs.build-wheel }}
      image-tag: ${{ needs.ensure-exabox-image.outputs.image-tag }}
