# Runs UMD tests in the ttsim-qemu VM (see .github/ttsim-qemu.Dockerfile), where tt-kmd binds the
# simulated chips and UMD takes the same path it takes on silicon.
name: Run ttsim-qemu tests

on:
  workflow_call:
    inputs:
      image-tag:
        required: false
        type: string
        default: latest
        description: 'Content-hash tag of the ttsim-qemu image from docker-image.yml. Defaults to latest.'

jobs:
  test:
    name: Test in ttsim VM (${{ matrix.card }}, ${{ matrix.binary }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per card and test binary keeps each well inside the timeout. The filters leave out the
        # tests that cannot pass in the VM; one that reaches an unmodelled part of ttsim ends QEMU and every
        # test after it, so it has to be filtered out rather than left to fail.
        #
        # The N150 and P150 rows name their TLB window suites in the positive half, so the filter check fails if one
        # stops being built. TTSimTlbWindowFixture stays unnamed: it opens ttsim in process and skips in the VM.
        # TestTlb.TestClusterExportDmabuf skips for want of an RDMA NIC.
        include:
          - card: n150
            lib: libttsim_wh.so
            bar4-size: 32M
            binary: api/api_tests
            # The sysmem, host memory channel and TestDeviceIOFixture.SysmemReadWrite exclusions need a hugepage the
            # guest does not have.
            tests: "*:*TestDeviceIOFixture.DynamicTLB_RW/*-*ClusterWarmResetScratch*:\
              TestFirmwareInfoProvider.ClockFrequencies:\
              TestFirmwareInfoProvider.EthFirmwareVersion:\
              TestFirmwareInfoProvider.GddrTelemetry:\
              TestFirmwareInfoProvider.TdpLimit:\
              TestCluster.GetEthernetFirmware:\
              TestCluster.TestClusterAICLKControl:\
              TestClusterDescriptor.BasicFunctionality:\
              *VerifyNocIdTranslatedCoordinatesMatch/*_via_NOC1:\
              *VerifyNocTranslationHostSide/*_NOC1_Normal:\
              *VerifyNocTranslationHostSide/TENSIX_NOC1_Harvested:\
              *VerifyTranslatedRegisterMatchesCoordinate/*_NOC1:\
              *VerifyNocIdTranslatedCoordinatesMatch/DRAM_*:\
              *VerifyNocIdTranslatedCoordinatesMatch/PCIE_*:\
              *VerifyNocIdTranslatedCoordinatesMatch/ARC_*:\
              *VerifyTranslatedRegisterMatchesCoordinate/*_NOC0:\
              *VerifyNocTranslationHostSide/ARC_NOC0_Normal:\
              *VerifyNocTranslationHostSide/PCIE_NOC0_Normal:\
              *VerifyNocTranslationHostSide/ROUTER_ONLY_NOC0_Normal:\
              *TestMulticastWrite/*_SingleCore_*:\
              ApiTTDeviceTest.MulticastIO:\
              TestDeviceIO.DMA*:\
              TestDeviceIOFixture.TestDmaMulticastWrite:\
              ApiTTDeviceTest.TTDeviceRegIO:\
              ApiTTDeviceTest.UninitializedError:\
              ApiSysmemManager.AutoNumChannels:\
              TestDeviceIOFixture.SysmemReadWrite:\
              ApiSysmemManager.AllocatedBufferBoundToNocIsReachableOverNoc:\
              ApiSysmemManager.AllocatedBufferIsNotNocBoundByDefault:\
              ApiSysmemManager.BuffersFromTwoAllocatorsOnOneDeviceAreDistinct:\
              ApiSysmemManager.DestroyedBufferReturnsItsHugepage:\
              ApiSysmemManager.MaxBufferCountAllowsOneGibBufferWithoutIommu:\
              ApiSysmemManager.OneGibAllocationSucceedsWithoutIommu:\
              *ApiSysmemManagerZeroCopyRange.ZeroCopyRangeOutsideBufferThrows/*:\
              ApiTTDeviceTest.SystemMemoryAllocatorPinsForItsDevice:\
              ApiClusterHostMemChannels.RoundTripThroughChannel:\
              ApiClusterHostMemChannels.OffsetWrapsAtChannelSize:\
              ApiClusterHostMemChannelSetup.ChannelsAreMappedOnlyWhileStarted:\
              ApiClusterHostMemChannelSetup.ChannelsSurviveRestart:\
              ApiClusterHostMemChannelSetup.ChannelMapsItsHugepageFileAfterAnUnrelatedBuffer:\
              TestRiscProgram.DeassertResetBrisc:\
              TestRiscProgram.DeassertResetWithCounterBrisc:\
              *TriscNcriscAssertDeassertTest*:\
              TestFirmwareInfoProvider.Heartbeat"
          - card: n150
            lib: libttsim_wh.so
            bar4-size: 32M
            binary: wormhole_b0/unit_tests
            # UnalignedTLB_RW writes host memory too, which needs a hugepage the guest does not have.
            tests: "*:ClusterWH.DynamicTLB_RW:ClusterWH.LargeAddressTlb-WormholeArcMessages.WormholeArcMessagesAICLK:\
              ClusterWH.HarvestingRuntime:\
              TestDeviceIO.DMA3:\
              ClusterWH.UnalignedTLB_RW:\
              ClusterWH.MultiThreadedMemBar"
          - card: n150
            lib: libttsim_wh.so
            bar4-size: 32M
            binary: unified/unified_tests
            tests: "*:TestTlb.*:*TestTlbRegisterReconfigure.*-DmaReadMixedCoreReproTest.DmaReadMixedCoreRepro:\
              Multiprocess.DMAWriteReadRaceCondition:\
              Multiprocess.LongLivedMonitor:\
              Multiprocess.WorkloadVSMonitor"
          - card: n150
            lib: libttsim_wh.so
            bar4-size: 32M
            binary: test_pcie_device/test_pcie_device
            tests: "*"
          # The P150 runs its TLB window suites here; its other suites need their own exclusions.
          # ClusterBH.UnalignedTLB_RW is left out for the same missing hugepage as on the N150.
          - {card: p150, binary: api/api_tests, lib: libttsim_bh.so, bar4-size: 32G,
             tests: "ApiClusterTest.OpenAllSiliconChips:*TestDeviceIOFixture.DynamicTLB_RW/*"}
          - {card: p150, binary: blackhole/unit_tests, lib: libttsim_bh.so, bar4-size: 32G,
             tests: ClusterBH.DynamicTLB_RW}
          - {card: p150, binary: unified/unified_tests, lib: libttsim_bh.so, bar4-size: 32G,
             tests: "TestTlb.*:*TestTlbRegisterReconfigure.*"}
          # Grendel wants two things the other cards do not: a BAR0 big enough to hold tt-kmd's own
          # TLB window (entry 164, 2.56 GB in) and a driver that knows Keraunos.
          #
          # BAR4 is 32G, not the 512G the model gives Quasar: tt-kmd serves an mmap of BAR4 UC from
          # 4<<36 for the BAR's whole length, so a BAR4 over 64G overlaps BAR4 WC at 5<<36 (and over
          # 128G the TLB windows at 6<<36). Nothing here maps BAR4, so 32G costs this row nothing.
          # Silicon's 512 GiB BAR4 hits the same limit: it is tt-kmd's fixed mmap offset layout.
          #
          # The patterns pick up new Grendel and Quasar suites without an edit here. *QuasarIoWindow*
          # is Quasar's TLB window suites, named on its own so the filter check fails if they stop
          # being built, which *Quasar* alone would not notice. The other TLB suites stay out: TestTlb
          # needs a Cluster, which has no Quasar topology discovery; TTSimTlbWindowFixture is in-process
          # ttsim and Blackhole only; the baremetal ones touch no device and run in the baremetal lane.
          # A DMA loopback suite stays out until the model routes the host window: an unrouted access
          # aborts the simulator, which takes the whole job down rather than failing the case.
          - {card: grendel, binary: api/api_tests, lib: libttsim_qsr.so, bar4-size: 32G,
             vm-opts: "--bar0-size 4G --kmd-module /opt/tenstorrent-keraunos.ko",
             tests: "Grendel*:*Quasar*:*QuasarIoWindow*"}
    # QEMU emulates the guest in software (TCG), so a standard runner without virtualization support works.
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository }}/tt-umd-ci-ttsim-qemu:${{ inputs.image-tag }}

    steps:
      # For run-gtest-checked.sh; the build itself comes from the artifact.
      - name: Checkout UMD
        uses: actions/checkout@v6

      - name: Use build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-ubuntu-22.04-Release

      - name: Untar build artifacts
        run: tar xf artifact.tar

      - name: Download ttsim binary
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f  # v1.13
        with:
          repository: tenstorrent/ttsim
          latest: true
          fileName: ${{ matrix.lib }}
          out-file-path: ttsim

      - name: Run the tests this card covers
        run: |
          run-in-ttsim-vm --lib "$PWD/ttsim/${{ matrix.lib }}" --bar4-size ${{ matrix.bar4-size }} \
              ${{ matrix.vm-opts }} -- \
              env LD_LIBRARY_PATH=build/lib \
              bash .github/run-gtest-checked.sh build/test/umd/${{ matrix.binary }} '${{ matrix.tests }}'
