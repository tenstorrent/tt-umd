# Boots the ttsim-qemu VM (see .github/ttsim-qemu.Dockerfile) and checks that tt-kmd binds the simulated
# chip, so the image other teams pull keeps working.
name: Run ttsim-qemu tests

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ensure-image:
    name: Ensure Docker image
    permissions:
      packages: write
    secrets: inherit
    uses: ./.github/workflows/docker-image.yml
    with:
      docker-version: ttsim-qemu
      # Building QEMU and the guest kernel module takes far longer than the default.
      timeout: 60

  smoke:
    name: Boot VM with Wormhole ttsim
    needs: ensure-image
    timeout-minutes: 15
    runs-on: tt-ubuntu-2204-large-stable
    container:
      image: ghcr.io/${{ github.repository }}/tt-umd-ci-ttsim-qemu:${{ needs.ensure-image.outputs.image-tag }}

    steps:
      - name: Download ttsim binary (wh)
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f  # v1.13
        with:
          repository: tenstorrent/ttsim
          latest: true
          fileName: "libttsim_wh.so"
          out-file-path: ttsim-wh

      - name: Check tt-kmd binds the simulated chip
        run: |
          run-in-ttsim-vm --lib "$PWD/ttsim-wh/libttsim_wh.so" --bar4-size 32M -- \
              ls -l /dev/tenstorrent/0
