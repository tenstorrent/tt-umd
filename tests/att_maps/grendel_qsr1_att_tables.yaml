# Authoritative Quasar NOC ATT tables for qsr.s1, as the firmware programs them.
#
# Extracted from models/qsr.s1/att/grendel_address_map_template.yaml in the grendelemulation
# repo -- its `mask_table` and `noc_endpoint_table`, restricted to the windows UMD resolves
# through -- and cross-checked against the live register readback in
# models/qsr.s1/docs/qmk_att_dump.md, sections 3 and 4. Field names are unchanged, so a
# refresh is a copy of the corresponding upstream entries.
#
# `translate_addr` is taken from the dump's Quasar column rather than the template. They
# disagree on entry 5, where the template says 1 but Quasar and Mimir are programmed with 0
# and the generated att/address_map.md calls that window pass-through. What the hardware is
# programmed with wins.
#
# This file is what test_grendel_att_map.cpp checks GRENDEL_QSR1_MAP against. It is a
# snapshot: refreshing it is what surfaces a POR move, and the test then says exactly which
# window or endpoint row disagrees.
#
# Coordinates are the POR package frame.

mask_table:
  - index: 4
    compare: '0x10000000000'
    mask: 30
    ep_idx: 24
    ep_id_size: 6
    table_offset: 128
    translate_addr: 1
  - index: 5
    compare: '0x1000000000000'
    mask: 38
    ep_idx: 33
    ep_id_size: 5
    table_offset: 96
    translate_addr: 0
  - index: 14
    compare: '0x1800000000'
    mask: 33
    ep_idx: 27
    ep_id_size: 6
    table_offset: 256
    translate_addr: 1

