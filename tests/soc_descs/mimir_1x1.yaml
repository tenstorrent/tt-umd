# One Mimir chiplet reached over JTAG, as a single UMD chip.
#
# Mimir carries no compute: it is DRAM plus the SMC (System Management Complex), the on-die
# management CPU that a JTAG bring-up client reaches first. The two halves of the Mimir are two
# locations on one DRAM channel.
#
# The (x, y) coordinates are UMD-side handles, not hardware NOC coordinates: chippy addresses a
# Mimir chiplet flat, with no coordinate component, so the routing protocol maps a core to a
# transport and an address base rather than to a NOC endpoint.

grid:
  x_size: 2
  y_size: 2

arc:
  []

pcie:
  []

dram:
  [[0-0, 1-0]]

# Dram view parameters are used by tt-metal and are not recognized by UMD.
# The emulator backs only 1 GiB per Mimir and cannot reset that page table, so
# each half is 512 MiB (128 MiB on each of its 4 channels). The second half
# starts 4 GiB after the first, so the two halves do not share backing pages.
# Mimir has no Ethernet, but eth_endpoint still has to name a location: Metal
# reads it per NOC when it builds the addressable-DRAM list.
# programmable: true marks that location's CCE as a Metal DRAM core.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 0,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    }
  ]

dram_view_size:
  536870912

eth:
  []

functional_workers:
  []

router_only:
  []

dispatch:
  []

smc:
  [0-1]

worker_l1_size:
  0

# UMD per-Mimir GDDR stride. Stays 8 GiB so the 4 GiB half-start fits in the window.
dram_bank_size:
  8589934592

eth_l1_size:
  0

# Grendel is the package/project; the architecture Metal and UMD expose is Quasar.
arch_name: QUASAR
