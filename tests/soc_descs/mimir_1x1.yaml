# One Mimir chiplet reached over JTAG, as a single UMD chip.
#
# Mimir carries no compute: it is DRAM plus the SMC (System Management Complex), the on-die
# management CPU that a JTAG bring-up client reaches first. The two DRAM cores mirror chippy's two
# GDDR instances per Mimir (kMimirGddrDramTile0SpaBaseAddr / Tile1SpaBaseAddr).
#
# The (x, y) coordinates are UMD-side handles, not hardware NOC coordinates: chippy addresses a
# Mimir chiplet flat, with no coordinate component, so the routing protocol maps a core to a
# transport and an address base rather than to a NOC endpoint. They are provisional pending the
# product/chippy answer on the DRAM instance and tile layout.

grid:
  x_size: 2
  y_size: 2

arc:
  []

pcie:
  []

dram:
  [[0-0],
  [1-0]]

# Dram view parameters are used by tt-metal and are not recognized by UMD.
# One view per GDDR instance; each bank is a single DRAM tile (subchannel 0).
# There is no Ethernet, so eth_endpoint is empty. worker_endpoint names that tile
# so Metal can address the bank without inventing Tensix endpoints.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [],
      worker_endpoint: [0],
      address_offset: 0
    },
    {
      channel: 1,
      eth_endpoint: [],
      worker_endpoint: [0],
      address_offset: 0
    }
  ]

dram_view_size:
  268435456

eth:
  []

functional_workers:
  []

router_only:
  []

dispatch:
  []

smc:
  [0-1]

worker_l1_size:
  0

dram_bank_size:
  8589934592

eth_l1_size:
  0

# Grendel is the package/project; the architecture Metal and UMD expose is Quasar.
arch_name: QUASAR
