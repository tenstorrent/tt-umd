# Two Mimir chiplets in one package, exposed as one UMD device.
#
# Each Mimir is one UMD DRAM channel, and that channel's two coordinates are
# its two locations. Metal sees each coordinate as its own DRAM view.
#
# The emulator backs only 1 GiB per Mimir and cannot reset that page table, so
# each half is 512 MiB (128 MiB on each of its 4 channels). Location 0 starts
# at offset 0. Location 1 starts 4 GiB later, selected by address_offset, so
# the two halves do not share backing pages.
#
# dram_bank_size stays 8 GiB. UMD uses it as the per-Mimir GDDR stride, so the
# second Mimir still begins 8 GiB after the first. The 4 GiB half-start still
# fits in that window.
#
# Coordinates are package-local UMD handles, not hardware NOC endpoints. The
# two SMC handles are M0 then M1.

grid:
  x_size: 4
  y_size: 2

arc:
  []

pcie:
  []

dram:
  [[0-0, 1-0],
  [2-0, 3-0]]

# Dram view parameters are used by tt-metal and are not recognized by UMD.
# worker_endpoint and eth_endpoint are the location index inside the channel,
# once per NOC. programmable: true marks that location's CCE as a Metal DRAM core.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 0,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    }
  ]

dram_view_size:
  536870912

eth:
  []

functional_workers:
  []

router_only:
  []

dispatch:
  []

smc:
  [0-1,
  1-1]

worker_l1_size:
  0

dram_bank_size:
  8589934592

eth_l1_size:
  0

arch_name: QUASAR
