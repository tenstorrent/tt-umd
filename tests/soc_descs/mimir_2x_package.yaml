# Two Mimir chiplets in one package, exposed as one UMD device.
#
# Same core map as mimir_2x_package.yaml: each Mimir is one UMD DRAM channel, and
# that channel's two coordinates are its two locations. Metal sees each
# coordinate as its own DRAM view of 4 GiB, half of the 8 GiB channel.
# Location 0 is the first 4 GiB. Location 1 is the next 4 GiB of the same
# channel, selected by address_offset.
#
# dram_bank_size stays 8 GiB. UMD uses it as the per-Mimir GDDR stride, so the
# second Mimir still begins 8 GiB after the first. A 4 GiB bank would make that
# stride overlap the first Mimir's second tile, and the 4 GiB offset would no
# longer fit in the window.
#
# Coordinates are package-local UMD handles, not hardware NOC endpoints. The
# two SMC handles are M0 then M1.

grid:
  x_size: 4
  y_size: 2

arc:
  []

pcie:
  []

dram:
  [[0-0, 1-0],
  [2-0, 3-0]]

# Dram view parameters are used by tt-metal and are not recognized by UMD.
# worker_endpoint and eth_endpoint are the location index inside the channel,
# once per NOC. programmable: true marks that location's CCE as a Metal DRAM core.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 0,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    }
  ]

dram_view_size:
  4294967296

eth:
  []

functional_workers:
  []

router_only:
  []

dispatch:
  []

smc:
  [0-1,
  1-1]

worker_l1_size:
  0

dram_bank_size:
  8589934592

eth_l1_size:
  0

arch_name: QUASAR
