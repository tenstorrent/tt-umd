# Two Mimir chiplets plus Keraunos, exposed as one UMD device.
#
# The Mimir topology matches mimir_2x_package.yaml. That file stays the two-Mimir
# package. This file is the MMK package, brought up with bringup_mmk.py.
#
# Coordinates are package-local UMD handles, not hardware NOC endpoints and not
# the MK package coordinates in topology.yaml. The two SMC handles are M0 then M1.
# The ethernet handles are the eight Keraunos CCEs on HSIO tiles 0-3.
# x = 4 + cce and y = hsio. The emulator implements those four tiles;
# hardware tile 4 is not in the model. The D2D link to M1 is still D2D 2.
#
# Chippy's mk_bringup scan chain is k0 at index 0, m0 at 1, m1 at 2. The index
# is not the digits of the chiplet id: k0 happening to be 0 is this package.
#
# HSIO tile 0 TL1 SRAM is chiplet-local 0x22800000. Tiles are 0x4000000 apart,
# and each tile holds two 4 MiB CCE regions (cce 0, then cce 1). A core's SRAM
# is local_window + hsio * tile_stride + cce * eth_l1_size. The package SPA
# table is a different address space. bringup_mmk.py releases HSIO tiles 0-3
# (both CCEs on each tile, cores held). D2D staging stays on tile 2, the link
# to M1.
#
# These cores are the Metal ethernet list. Opening this descriptor installs the
# idle-ethernet map and firmware. A Quasar descriptor with eth: [] keeps the
# on-package image, which loads nothing.

grid:
  x_size: 6
  y_size: 4

arc:
  []

pcie:
  []

dram:
  [[0-0, 1-0],
  [2-0, 3-0]]

# Dram view parameters are used by tt-metal and are not recognized by UMD.
# worker_endpoint and eth_endpoint are the location index inside the channel,
# once per NOC. programmable: true marks that location's CCE as a Metal DRAM core.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 0,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [0, 0],
      worker_endpoint: [0, 0],
      address_offset: 0,
      programmable: true
    },
    {
      channel: 1,
      eth_endpoint: [1, 1],
      worker_endpoint: [1, 1],
      address_offset: 4294967296,
      programmable: true
    }
  ]

dram_view_size:
  536870912

eth:
  [4-0, 5-0, 4-1, 5-1, 4-2, 5-2, 4-3, 5-3]

functional_workers:
  []

router_only:
  []

dispatch:
  []

smc:
  [0-1,
  1-1]

worker_l1_size:
  0

dram_bank_size:
  8589934592

# One Keraunos CCE region. Chippy _KER_CCE_REGION_SIZE.
eth_l1_size:
  4194304

arch_name: QUASAR

# Chiplet-local AXI behind chippy. Omitting this selects full_package.
address_space: mimir_local

# Channel is not the SPA instance or the chippy id; both are recorded here.
# MMK wires M0 D2D1 to M1 D2D0. M0 D2D0 has no Mimir peer.
mimir_channels:
  - channel: 0
    instance: 0
    chiplet: m0
    routes:
      - peer: 1
        d2d: 1
  - channel: 1
    instance: 1
    chiplet: m1
    routes:
      - peer: 0
        d2d: 0

# 0x22800000, tile stride 0x4000000. x = 4 + cce, y = hsio, tiles 0-3.
keraunos:
  chiplet: k0
  tap: 0
  local_window: 578813952
  tile_stride: 67108864
  cores:
    - core: 4-0
      hsio: 0
      cce: 0
    - core: 5-0
      hsio: 0
      cce: 1
    - core: 4-1
      hsio: 1
      cce: 0
    - core: 5-1
      hsio: 1
      cce: 1
    - core: 4-2
      hsio: 2
      cce: 0
    - core: 5-2
      hsio: 2
      cce: 1
    - core: 4-3
      hsio: 3
      cce: 0
    - core: 5-3
      hsio: 3
      cce: 1
